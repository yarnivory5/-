<template id="about"><div class="panel-layout"><div><p class="eyebrow">01 / ORIGIN</p><h2 id="panel-title">刚刚毕业，<br>也刚刚<span>出发。</span></h2><p class="panel-lead">我是邓希杰，来自江西。</p><p>2026 年，我从江西科技学院毕业。大学期间，马拉松和书法成为我的两个爱好。赛事照片、收藏的奖牌和日常练字片段，留下了这段时光里具体而真实的足迹。</p><p>现在，我希望继续学习，找到一份合适的工作。也期待与身边的人友好相处，一起进步。</p><dl><div><dt>毕业院校</dt><dd>江西科技学院</dd></div><div><dt>毕业年份</dt><dd>2026</dd></div><div><dt>来自</dt><dd>江西</dd></div></dl></div><figure class="photo"><img src="portrait.jpg" alt="邓希杰" width="720" height="867"><figcaption>A LITTLE ABOUT ME / 很高兴遇见你</figcaption></figure></div></template>
